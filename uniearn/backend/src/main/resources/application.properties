spring.application.name=projectname
server.port=8080

# ---- Database (MySQL) ----
# Override any of these with environment variables, or just edit the defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uniearn_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# MUST be at least 32 characters. Change this for anything beyond local development.
app.jwt.secret=${JWT_SECRET:uniearn-dev-secret-change-me-please-0123456789}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
